map $uri $frontend_cache_control {
    default "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}

map $uri $frontend_content_security_policy {
    default "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-src https://yandex.ru; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    ~^/docs(/oauth2-redirect)?$ "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self'; connect-src 'self'; frame-src https://yandex.ru; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    /redoc "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; worker-src 'self' blob:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-src https://yandex.ru; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control $frontend_cache_control always;
    add_header Content-Security-Policy $frontend_content_security_policy always;

    location ~ ^/(api|trips|profile|health|docs|redoc|openapi\.json)(/|$) {
        set $backend app:8080;
        proxy_pass http://$backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 450s;
        proxy_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
