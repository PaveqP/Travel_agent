services:
  postgres:
    image: postgres:17-alpine@sha256:e4cb93687b062cd25a0e8f672d85a7708235009d70d31f8a7698d9370092a9c4
    platform: linux/amd64
    user: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: ${TRAVEL_POSTGRES_PASSWORD:?Set TRAVEL_POSTGRES_PASSWORD}
      POSTGRES_DB: travel
    ports:
      - "127.0.0.1:${TRAVEL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - travel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  app:
    platform: linux/amd64
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      MODEL: ${MODEL:?Set MODEL in the root .env}
      TOKEN: ${TOKEN:?Set TOKEN in the root .env}
      BASE_URL: ${BASE_URL:?Set BASE_URL in the root .env}
      TRAVEL_POSTGRES_HOST: postgres
      TRAVEL_POSTGRES_PASSWORD: ${TRAVEL_POSTGRES_PASSWORD:?Set TRAVEL_POSTGRES_PASSWORD in the root .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TRAVEL_PUBLIC_URL: ${TRAVEL_PUBLIC_URL:-http://127.0.0.1:8080}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5))['persistent'];
          assert 'telegram_configured' in json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/config', timeout=5))
      interval: 15s
      timeout: 12s
      retries: 4
      start_period: 30s
  frontend:
    platform: linux/amd64
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      app:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 5s
volumes:
  travel_postgres:
