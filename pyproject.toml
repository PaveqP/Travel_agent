[project]
name = "flinters-integration-research"
version = "0.1.0"
description = "Reproducible API and MCP research for Greater Sochi"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<0.29",
  "python-dotenv>=1.1,<2",
  "pydantic>=2.11,<3",
  "mcp>=1.20,<2",
  "jsonschema>=4.26,<5",
  "langgraph==1.2.17",
  "langchain==1.4.7",
  "langchain-core==1.7.0",
  "langchain-openai==1.7.2",
  "langgraph-checkpoint-postgres==3.2.0",
  "langgraph-checkpoint-sqlite==3.1.2",
  "aiosqlite==0.22.1",
  "psycopg[binary,pool]==3.3.6",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "reportlab==5.1.0",
  "pillow==13.0.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["travel_agent*", "integrations*"]

[tool.setuptools.package-data]
travel_agent = ["prompts/*.md", "assets/*.ttf", "assets/OFL.txt"]
